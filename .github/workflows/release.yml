name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run tests

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, curl, openssl

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run tests
        run: ./vendor/bin/pest

  release:
    runs-on: ubuntu-latest
    needs: test
    name: Build and publish release

    steps:
      - uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, curl, openssl

      - name: Build release zip
        run: bash scripts/build-release.sh "${{ steps.version.outputs.version }}"

      - name: Validate release
        run: |
          cd build/vaka-${{ steps.version.outputs.version }}
          php vaka version | grep -qxF "Vaka ${{ steps.version.outputs.version }}"
          RUN_AT_SECOND=0 php vaka run
          php -S 127.0.0.1:8787 -t public > /dev/null 2>&1 &
          sleep 1
          health=$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:8787/?health')
          login=$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:8787/?login')
          kill %1 || true
          if [ "$health" != "200" ] || [ "$login" != "200" ]; then
            echo "Release check failed: /?health answered $health, /?login answered $login"
            exit 1
          fi
          echo "Release check passed: it runs, /?health and /?login answer 200"

      - name: Extract changelog for this version
        run: |
          awk -v head="## [${{ steps.version.outputs.version }}]" \
            'index($0, head) == 1 { found = 1; next } /^## \[/ || /^\[[^]]+\]: / { found = 0 } found' \
            CHANGELOG.md > build/release-notes.md
          if ! grep -q '[^[:space:]]' build/release-notes.md; then
            echo "CHANGELOG.md has nothing under [${{ steps.version.outputs.version }}]"
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "build/vaka-${{ steps.version.outputs.version }}.zip" \
            --title "Vaka ${{ steps.version.outputs.version }}" \
            --notes-file build/release-notes.md
