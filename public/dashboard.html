<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
<meta name="csrf-token" content="{{csrf}}">
<title>Vaka</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml" data-favicon>
<link rel="manifest" href="/?manifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vaka">
<link rel="preload" href="fonts/figtree-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css?v={{asset}}">
<script src="theme.js?v={{asset}}"></script>
<script src="app.js?v={{asset}}" defer></script>
</head>
<body>
<a class="skip-link" href="#sites-title">Skip to all sites</a>
<header class="topbar">
  <a class="brand" href="/" aria-label="Vaka, home">
    {{mark}}
    <span class="brand-name">Vaka</span>
  </a>
  <p class="run-pill" data-region="run-state"><span class="run-dot"></span><span data-run-text>Starting…</span></p>
  <span class="topbar-spacer"></span>
  <button type="button" class="icon-button" data-action="theme" aria-label="Colour theme: system">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" data-theme-icon><path d="M4 5h16v11H4zM9 20h6M12 16v4"/></svg>
    <span class="label" data-theme-label>System</span>
  </button>
  <form method="post" action="/?logout">
    <input type="hidden" name="_token" value="{{csrf}}">
    <button type="submit" class="icon-button" aria-label="Log out {{user}}">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 8l-4 4 4 4M6 12h10"/></svg>
      <span class="label">Log out</span>
    </button>
  </form>
</header>

<main id="app" aria-busy="true">
  <div data-region="banner"></div>
  <section data-region="watch" aria-live="polite">
    <!-- While the overview loads: the panel and the list in the shape they will have, so nothing jumps when they come -->
    <div class="watch is-loading">
      <div>
        <p class="watch-kicker">Keeping watch</p>
        <h1>Looking at your sites…</h1>
        <p class="watch-line" aria-hidden="true"><span class="placeholder is-night is-wide"></span></p>
        <ul class="watch-stats" aria-hidden="true">
          <li><b class="placeholder is-night is-stat"></b><span class="placeholder is-night is-label"></span></li>
          <li><b class="placeholder is-night is-stat"></b><span class="placeholder is-night is-label"></span></li>
          <li><b class="placeholder is-night is-stat"></b><span class="placeholder is-night is-label"></span></li>
        </ul>
      </div>
      <div class="watch-perch" data-perch></div>
    </div>
  </section>
  <section class="attention" data-region="attention" aria-labelledby="attention-title" hidden></section>
  <section data-region="sites" aria-labelledby="sites-title">
    <div class="sites-head">
      <h2 class="section-title" id="sites-title" tabindex="-1">All sites</h2>
      <button type="button" class="button add-site" data-action="add-site" data-add-site hidden>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"/></svg>
        Add a site
      </button>
      <button type="button" class="button add-group" data-action="add-group" data-add-group hidden>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"/></svg>
        Add a group
      </button>
      <label class="filter">
        <span class="visually-hidden">Filter sites</span>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
        <input type="search" data-filter placeholder="Filter by name or group" autocomplete="off" spellcheck="false">
        <kbd aria-hidden="true">Ctrl K</kbd>
      </label>
    </div>
    <div data-region="groups">
      <div class="group is-loading" aria-hidden="true">
        <div class="group-head"><span class="placeholder is-title"></span><span class="placeholder is-meta"></span></div>
        <ul class="site-list">
          <li><div class="site-row is-placeholder"><span class="placeholder is-status"></span><span class="placeholder is-name"></span><span class="placeholder is-days"></span><span class="placeholder is-figure"></span><span class="placeholder is-figure"></span><span class="placeholder is-grade"></span></div></li>
          <li><div class="site-row is-placeholder"><span class="placeholder is-status"></span><span class="placeholder is-name is-short"></span><span class="placeholder is-days"></span><span class="placeholder is-figure"></span><span class="placeholder is-figure"></span><span class="placeholder is-grade"></span></div></li>
          <li><div class="site-row is-placeholder"><span class="placeholder is-status"></span><span class="placeholder is-name"></span><span class="placeholder is-days"></span><span class="placeholder is-figure"></span><span class="placeholder is-figure"></span><span class="placeholder is-grade"></span></div></li>
          <li><div class="site-row is-placeholder"><span class="placeholder is-status"></span><span class="placeholder is-name is-short"></span><span class="placeholder is-days"></span><span class="placeholder is-figure"></span><span class="placeholder is-figure"></span><span class="placeholder is-grade"></span></div></li>
        </ul>
      </div>
    </div>
  </section>
</main>

<footer class="foot">
  <span data-foot data-version="{{version}}">Vaka {{version}}</span>
  {{credit}}
</footer>

<dialog class="drawer" data-region="detail" aria-labelledby="detail-title"></dialog>
<p class="toast" data-region="toast" role="status" aria-live="polite" popover="manual"></p>
</body>
</html>
