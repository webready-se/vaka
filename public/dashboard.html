<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" content="{{csrf}}">
<title>Vaka</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css?v={{version}}">
<script src="theme.js?v={{version}}"></script>
<script src="app.js?v={{version}}" defer></script>
</head>
<body>
<a class="skip-link" href="#sites-title">Skip to all sites</a>
<header class="topbar">
  <a class="brand" href="/">
    <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
      <path class="owl-body" d="M14 22c0-8 6-14 18-14s18 6 18 14v18c0 10-8 18-18 18S14 50 14 40z"/>
      <circle class="owl-eye" cx="24" cy="28" r="7"/><circle class="owl-eye" cx="40" cy="28" r="7"/>
      <circle class="owl-pupil" cx="24" cy="28" r="3"/><circle class="owl-pupil" cx="40" cy="28" r="3"/>
      <path class="owl-beak" d="M29 35l3 5 3-5z"/>
    </svg>
    <span>Vaka</span>
  </a>
  <p class="run-state" data-region="run-state"></p>
  <div class="topbar-actions">
    <button type="button" class="ghost-button" data-action="theme" aria-label="Colour theme: system">
      <span data-theme-label>System</span>
    </button>
    <form method="post" action="/?logout">
      <input type="hidden" name="_token" value="{{csrf}}">
      <button type="submit" class="ghost-button">Log out <span class="topbar-user">{{user}}</span></button>
    </form>
  </div>
</header>

<main id="app" aria-busy="true">
  <div data-region="banner"></div>
  <section class="hero" data-region="hero" aria-live="polite">
    <p class="loading">Loading…</p>
  </section>
  <section class="attention" data-region="attention" aria-labelledby="attention-title" hidden></section>
  <section class="sites-section" aria-labelledby="sites-title">
    <div class="sites-head">
      <h2 id="sites-title" tabindex="-1">All sites</h2>
      <label class="filter">
        <span class="visually-hidden">Filter sites</span>
        <input type="search" data-filter placeholder="Filter by name or group" autocomplete="off" spellcheck="false">
      </label>
    </div>
    <div data-region="groups"></div>
  </section>
</main>

<dialog class="detail" data-region="detail" aria-labelledby="detail-title"></dialog>
<p class="toast" data-region="toast" role="status" aria-live="polite"></p>
</body>
</html>
